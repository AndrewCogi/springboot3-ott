<!DOCTYPE html>
<html>

<head>
	<link rel="icon" href="/favicon.ico">
	<title>Verification Failed</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
		}

		.container {
			max-width: 600px;
			margin: 50px auto;
			background: white;
			padding: 15px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			border-radius: 8px;
			border: 1px solid #f5c6cb;
		}

		h1 {
			font-size: 24px;
			color: #dc3545;
			text-align: center;
			margin-bottom: 20px;
		}

		p {
			margin: 12px;
			color: #555;
		}

		.highlight {
			font-weight: bold;
			color: #333;
		}

	</style>
</head>

<body>
	<div class="container">
		<h1>Verification Failed</h1>
		<p class="highlight" th:text="${errorMessage}"></p>
	</div>
</body>

</html>
