# 실행 명령어 : docker compose up -d
# 접속 명령어 : docker containe exec -it {docker-id} redis-cli -a {redisPW}

version: '3.7'
services:
  redis-refresh-token:
    image: redis:alpine
    command: redis-server /usr/local/etc/redis-refresh-token/redis.conf --requirepass q1w2e3r4
    ports:
      - "6379:6379"
    volumes:
      - ./data/refresh-token-data:/data
      - ./data/refresh-token-data/redis.conf:/usr/local/etc/redis-refresh-token/redis.conf
